name: Microlight CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      mobile: ${{ steps.select.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: bash .github/scripts/test-platforms.sh

  test:
    name: Test (${{ matrix.platform }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-daemon glib-networking gsettings-desktop-schemas libglib2.0-bin \
            fonts-dejavu-core libpangocairo-1.0-0
      - name: Test
        if: runner.os != 'Linux'
        run: go test -mod=readonly -count=1 ./...
      - name: Test with GNOME PAC resolver
        if: runner.os == 'Linux'
        env:
          MICROLIGHT_TEST_GIO_PAC: '1'
          XDG_CURRENT_DESKTOP: GNOME
        run: dbus-run-session -- go test -mod=readonly -count=1 ./...

  web:
    name: Web test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test HTTP server and build Web packages
        run: |
          go test -mod=readonly -count=1 ./cmd/webserver
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export MICROLIGHT_BUILD_VERSION="$GITHUB_REF_NAME"; fi
          bash scripts/package-web.sh
      - uses: actions/upload-artifact@v7
        with:
          name: microlight-web
          path: dist/microlight-*-web-*.tar.gz
          if-no-files-found: error

  mobile:
    name: Mobile build (${{ matrix.platform }})
    needs: platforms
    if: needs.platforms.outputs.mobile == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios, runner: macos-15 }
          - { platform: android, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        if: matrix.platform == 'android'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('go.sum', '**/*.kts') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Build mobile packages
        env:
          IOS_CERTIFICATE_BASE64: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROFILE_BASE64: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.IOS_PROFILE_BASE64 || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_KEY_ALIAS || '' }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.MYGO_ANDROID_KEYSTORE_PASSWORD || '' }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.MYGO_ANDROID_KEY_PASSWORD || '' }}
        run: bash .github/scripts/build-mobile.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: microlight-${{ matrix.platform }}
          path: |
            dist/mobile/*.apk
            dist/mobile/*.ipa
            dist/mobile/*.zip
          if-no-files-found: error

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, mobile, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: amd64 }
          - { runner: macos-15-intel, platform: darwin, arch: amd64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
          - { runner: windows-2025, platform: windows, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and name release assets
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bash .github/scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: microlight-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/microlight-*-${{ matrix.platform }}-${{ matrix.arch }}.*
            dist/update-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, mobile, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: microlight-*
          merge-multiple: true
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/microlight-"$GITHUB_REF_NAME"-* dist/update-*.json dist/microlight-"${GITHUB_REF_NAME#v}"-*.tar.gz)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Microlight $GITHUB_REF_NAME"
