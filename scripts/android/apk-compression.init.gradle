// Scoped to the MyGo host generated by this invocation of scripts/build.sh.
// finalizeDsl runs after MyGo's explicit default, before AGP locks variants.
gradle.beforeProject { project ->
    def buildRoot = System.getenv('MICROLIGHT_ANDROID_BUILD_ROOT')
    if (buildRoot != null && project.rootDir.canonicalPath == new File(buildRoot).canonicalPath && project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.packaging.jniLibs.useLegacyPackaging = true
            }
        }
    }
}
